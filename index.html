<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봉 룰렛 (Bong Roulette)</title>
<style>
:root{--bg:#0a0a0f;--line:#2a2a3a;--text:#ecedf3;--muted:#8b8d9c;--accent:#4fd1c5;--danger:#ff4d6d;--gold:#ffd166}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;background:#12121a;border:1px solid var(--line);border-radius:12px}
#ctrl{left:12px;top:12px;bottom:12px;width:270px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
#ctrl .head{font-weight:800;font-size:15px;letter-spacing:.3px}
#ctrl .head small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
#ctrl label.t{display:block;font-weight:700;margin-bottom:5px;font-size:12px}
#ctrl textarea{width:100%;height:210px;resize:none;background:#0d0d14;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;line-height:1.4}
#ctrl textarea:disabled{opacity:.5}
.hint{color:var(--muted);font-size:11px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:center;gap:6px}
.opt .k{width:60px;color:var(--muted);font-size:12px;flex:none}
.seg{display:flex;background:#0d0d14;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);padding:5px 9px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
.seg button.on{background:#232336;color:var(--text)}
.opt input[type=number]{width:60px;background:#0d0d14;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font:inherit}
.seedv{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.btns{display:flex;gap:6px}
.btn{flex:1;border:1px solid var(--line);background:#1a1a26;color:var(--text);border-radius:8px;padding:8px 6px;cursor:pointer;font:inherit;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{background:#242436}
.btn.primary{background:var(--accent);color:#06201d;border-color:transparent}.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.feedwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.feedwrap h3{margin:0;font-size:12px;color:var(--muted);font-weight:600}
#feed{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:12px}
#feed div{background:#0d0d14;padding:4px 8px;border-radius:6px;line-height:1.35}
#feed div.big{background:#2a1520;border:1px solid rgba(255,77,109,.5)}
#feed div.gold{background:#2a2410;border:1px solid rgba(255,209,102,.5)}
#feed b{font-weight:700}
#rank{top:12px;right:12px;width:230px;max-height:calc(100% - 24px);overflow:auto;padding:10px 12px;font-size:13px}
#rank h3{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:8px;padding:3px 0;line-height:1.2}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .hp{width:54px;height:6px;background:#23232f;border-radius:3px;overflow:hidden;flex:none}
.row .hp i{display:block;height:100%}
.row .rk{color:var(--muted);font-variant-numeric:tabular-nums;width:26px;text-align:right;font-size:12px;flex:none}
.row.dead{color:#5f6170}.row.dead .nm{text-decoration:line-through;opacity:.55}.row.dead .dot{background:#3a3a48!important}
.row.win .nm{color:var(--gold)}
#mtabs{display:none}
/* 모바일: 위쪽은 경기장, 아래 46%는 설정/순위 시트 (탭으로 전환) */
@media (max-width:820px){
  body{touch-action:manipulation}
  #mtabs{display:flex;position:fixed;left:0;right:0;bottom:46vh;height:36px;z-index:3;background:#12121a;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  #mtabs button{flex:1;background:transparent;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
  #mtabs button.on{color:var(--text);background:#232336}
  #ctrl,#rank{left:0;right:0;top:auto;bottom:0;width:auto;height:46vh;max-height:46vh;border-radius:0;border-left:0;border-right:0;border-bottom:0;overflow:auto;padding:10px 12px}
  #ctrl{display:flex;gap:8px}
  #ctrl .head{display:none}
  #ctrl textarea{height:96px}
  .feedwrap{flex:none;min-height:0}
  #feed{max-height:150px}
  body[data-tab="rank"] #ctrl{display:none}
  body:not([data-tab="rank"]) #rank{display:none}
  .btns{position:sticky;top:-10px;z-index:1;background:#12121a;padding:6px 0}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ctrl" class="panel">
  <div class="head">⚔️ 봉 룰렛<small>Bong Roulette · Last Man Standing</small></div>
  <div class="seg" id="gameSeg" title="라스트맨스탠딩: 경기장 전투 / 레이스: 트랙을 돌며 한 바퀴마다 꼴찌 탈락. 결전 인원부터 스킬 (피해는 정지·뒤로 밀림)"><button data-v="arena" class="on">⚔️ 라스트맨스탠딩</button><button data-v="race">🏁 레이스</button><button data-v="hole">🌀 블랙홀</button></div>
  <div>
    <div class="opt" style="margin-bottom:8px" title="켜기: 이름과 같은 그림은 자동 매칭, 없는 이름은 무작위 얼굴 / 끄기: 색 공만"><span class="k">🖼️ 얼굴</span>
      <div class="seg" id="faceSeg"><button data-v="1" class="on">켜기</button><button data-v="0">끄기</button></div>
    </div>
    <label class="t" for="names">이름들을 입력하세요</label>
    <textarea id="names" spellcheck="false">송판*1, 네즈미*1, 강자*1, 루시엘*1, 신가호*1, 게코스*1, 비아트리체*1, 드응으루마루헤이요*1, 테무르*1, 미카엘린*1, 미카엘라*1, 러한테스메르*1, 배해수*1, 안나*1, 오마에*1, 헤이즐*1, 한봉식*1, 큐피*1, 세실리아*1, 광견이형*1, 햇냥이*1, 메리미*1,</textarea>
    <div class="hint">쉼표나 줄바꿈으로 구분. <b>이름*숫자</b>로 같은 이름을 여러 개 넣어요. 입력을 고치면 바로 리셋됩니다.</div>
  </div>
  <div class="opts">
    <div class="opt"><span class="k">🏆 당첨</span>
      <div class="seg" id="modeSeg"><button data-v="first" class="on">최후 생존</button><button data-v="last">첫 탈락</button><button data-v="multi">여러명</button></div>
    </div>
    <div class="opt" id="multiRow" hidden><span class="k">👥 인원</span><input type="number" id="multiN" min="1" value="2"></div>
    <div class="opt"><span class="k">⏩ 속도</span>
      <div class="seg" id="speedSeg"><button data-v="1" class="on">1x</button><button data-v="2">2x</button><button data-v="4">4x</button></div>
    </div>
    <div class="opt" id="zoneRow"><span class="k">🌀 자기장</span>
      <div class="seg" id="zoneSeg"><button data-v="1">켜기</button><button data-v="0" class="on">끄기</button></div>
    </div>
    <div class="opt" title="켜기: 같은 이름끼리도 서로 공격 (완전 개인전) / 끄기: 같은 이름끼리는 노리지도 않고 피해도 없음"><span class="k">⚔️ 팀킬</span>
      <div class="seg" id="teamSeg"><button data-v="1" class="on">켜기</button><button data-v="0">끄기</button></div>
    </div>
    <div class="opt" title="남은 공이 이 수가 되면 체력 회복 + 스킬 획득 결전이 시작되고 카메라가 따라갑니다"><span class="k">⚔️ 결전</span><input type="number" id="finalN" min="2" max="10" value="5"><span class="k" style="width:auto">명 남으면 시작</span></div>
    <div class="opt"><span class="k">🎲 시드</span><span class="seedv" id="seedText"></span></div>
  </div>
  <div class="btns">
    <button class="btn" id="btnShuffle">🔀 섞기</button>
    <button class="btn primary" id="btnStart">▶ 시작</button>
  </div>
  <div class="feedwrap"><h3>전투 기록</h3><div id="feed"></div></div>
</div>

<div id="rank" class="panel"><h3><span>순위</span><span id="rankHead">0 / 0</span></h3><div id="rankAlive"></div><div id="rankDead"></div></div>
<div id="mtabs"><button data-t="ctrl" class="on">⚙️ 설정</button><button data-t="rank">🏆 순위</button></div>

<script>
(() => {
'use strict';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const FONT='Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let seed=(Math.random()*1e9)>>>0, rng=mulberry32(seed);
const rand=(a=0,b=1)=>a+(b-a)*rng();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const hpColor=hp=>hp>60?'#5be38b':hp>30?'#ffd166':'#ff4d6d';

const $=s=>document.querySelector(s);
const canvas=$('#game'),ctx=canvas.getContext('2d');
const namesEl=$('#names'),rankAlive=$('#rankAlive'),rankDead=$('#rankDead'),rankHead=$('#rankHead'),feedEl=$('#feed');
const btnStart=$('#btnStart'),btnShuffle=$('#btnShuffle');
const multiN=$('#multiN'),multiRow=$('#multiRow'),seedText=$('#seedText'),finalN=$('#finalN');

// ---------- 설정 ----------
// 맵: 양끝이 반원인 가로로 긴 경기장. 세로 반지름 ARENA_R, 직선 구간의 절반 길이 ARENA_L
const ARENA_R=320, ARENA_L=240;
// 맵 구조물: 얇은 벽 6개 (점 2개 = 양끝이 둥근 막대, rc = 벽 두께의 절반)
// 중심을 기준으로 점대칭이라 왼쪽 위 ↔ 오른쪽 아래가 대각선으로 짝을 이룸. 가운데 반지름 CENTER_R 안은 비워 둠
const CENTER_R=170;
const OBST=[
  {pts:[[-235,-205],[-135,-125]],rc:7}, // 왼쪽 위 대각선 벽
  {pts:[[235,205],[135,125]],rc:7},     // 오른쪽 아래 대각선 벽
  {pts:[[60,-215],[200,-215]],rc:7},    // 위쪽 가로 벽 (오른쪽)
  {pts:[[-60,215],[-200,215]],rc:7},    // 아래쪽 가로 벽 (왼쪽)
  {pts:[[-420,-60],[-420,60]],rc:7},    // 왼쪽 끝 세로 벽
  {pts:[[420,-60],[420,60]],rc:7},      // 오른쪽 끝 세로 벽
];
for(const o of OBST){let a=0;const n=o.pts.length;for(let i=0;i<n;i++){const [x1,y1]=o.pts[i],[x2,y2]=o.pts[(i+1)%n];a+=x1*y2-x2*y1}o.sign=a>=0?1:-1}
const BAR_H=46, BAR_Y=12;   // 이름별 체력바 높이/상단 여백
const DUEL_H=60;            // 마지막 1:1 패널 높이
const BARS_AT=12;           // 남은 이름이 이 수 이하가 되면 체력바 표시
const FINAL_AT=5;           // 결전 인원 기본값 (옵션 ⚔️ 결전, 2~10). 남은 공이 이 수 이하가 되면 결전 단계 (카메라도 이때부터)
const CFG={
  hpMax:160,
  accel:260,        // 추적 가속도
  maxSpeed:500,     // 최고 속도
  damping:1.3,      // 감속
  restitution:0.88, // 반발 계수
  dashMin:380,dashMax:500, // 돌진 순간 가속
  dashCdMin:0.9,dashCdMax:2.0, // 간격을 두고 싸우게 되면서 돌진을 더 자주 (판 길이 보정)
  dashRange:300,    // 이 거리 안에서만 돌진
  sepRange:1.6,     // 간격 유지: 반지름 합의 이 배수 안이면 서로 밀어냄
  sepForce:900,     // 간격 유지 힘
  prefGap:70,       // 상대와 이 정도 간격을 두고 맴돌다가 돌진으로만 붙음
  recoil:0.3,       // 맞부딪힌 뒤 추적을 멈추는 시간(초)
  recoilKick:120,   // 맞부딪힌 뒤 서로 튕겨 나가는 속도
  dmgThreshold:280, // 이 상대속도 이하 충돌은 무피해 (돌진 충돌만 피해)
  dmgScale:0.07,    // 피해 = (상대속도-임계)*scale
  dmgCap:40,        // 한 방 최대 피해 (치명타 전)
  counterRatio:0.5, // 공격자가 되받는 피해 비율
  hitInv:0.5,       // 피격 후 무적(초)
  critChance:0.08,
  zoneGrace:5,      // 자기장 시작 전 유예(초)
  zoneRate:3.0,     // 자기장 축소 속도 (세로 반지름 기준)
  zoneRateFinal:7,  // 생존 3명 이하일 때 축소 속도
  zoneMinR:36,
  zoneDps:4,        // 자기장 밖 초당 피해 (시간에 따라 증가)
};
const opt={mode:'first',speed:1,zone:false,teamFire:true,cine:false,faces:true,finalAt:FINAL_AT,game:'arena'}; // game: 'arena' 라스트맨스탠딩 / 'race' 레이스 // zone: 자기장(기본 꺼짐), teamFire: 같은 이름끼리도 공격, cine: 결전 슬로모션 연출(기본 꺼짐), faces: 얼굴 그림(기본 켜짐)

// 결전 단계 스킬 (남은 공들에게 무작위로 하나씩, 서로 다르게)
const SKILLS={
  flame:{name:'화염검',icon:'🔥',color:'#ff7a3d',desc:'불타는 검. 돌진이 빠르고 충돌 피해 2.6배'},
  shield:{name:'철벽',icon:'🛡️',color:'#7fd3ff',desc:'방패와 투구. 6초마다 피해를 한 번 막음'},
  bolt:{name:'번개',icon:'⚡',color:'#ffe66d',desc:'마법사 모자와 지팡이. 4.5초마다 가까운 상대에게 번개 19'},
  blink:{name:'순간이동',icon:'💨',color:'#c8b6ff',desc:'닌자 두건과 쿠나이. 4.5초마다 상대 옆으로 순간이동해 쿠나이로 20, 이어서 돌진'},
  wave:{name:'충격파',icon:'💥',color:'#ff5ca8',desc:'뿔 투구와 전쟁 망치. 6초마다 반경 280을 밀쳐내고 가까운(190) 상대에게 피해 20'},
  drain:{name:'흡혈',icon:'🩸',color:'#ff4d6d',desc:'망토와 실크햇. 입힌 피해의 60%만큼 회복'},
  frost:{name:'빙결',icon:'❄️',color:'#9fe8ff',desc:'얼음 왕관과 지팡이. 5초마다 얼음 창을 날려 궤적의 상대에게 9를 주고 1.2초 얼림, 언 상대는 피해 1.4배'},
  magnet:{name:'자석',icon:'🧲',color:'#ff9de2',desc:'안전모와 U자 자석. 6초마다 2초 동안 물결 원(반경 170) 안의 상대를 끌어당김, 당기는 동안 부딪히면 피해 1.7배'},
  arrow:{name:'화살',icon:'🏹',color:'#e0c080',desc:'깃털 모자와 활. 3초마다 가까운 상대에게 화살 18'},
  bomb:{name:'폭탄',icon:'💣',color:'#ffb347',desc:'철모와 폭탄. 6초마다 폭탄 설치, 1.5초 뒤 폭발 피해 36 (붉은 원이 피해 범위, 바깥 점선까지 밀쳐냄)'},
  laser:{name:'레이저',icon:'🔴',color:'#ff3b5c',desc:'바이저와 레이저 총. 6초마다 벽까지 뻗는 직선 레이저, 선 위의 모두에게 피해 22'},
  firestep:{name:'파이어스텝',icon:'👣',color:'#ff5722',desc:'불꽃 신발. 지나간 길에 불이 1.6초 남아 밟는 상대에게 초당 피해 13 (방패 무시)'},
  hammer:{name:'망치',icon:'🔨',color:'#ffcc00',desc:'두건과 대형 망치. 5초마다 망치를 휘둘러 닿는 상대를 아주 멀리 날려버림, 피해 34'},
  giant:{name:'거인화',icon:'🗿',color:'#c49a6c',desc:'몸집 1.6배, 체력 1.4배, 들이받는 피해 1.9배, 자기를 들이받은 상대를 멀리 튕겨냄. 대신 조금 느림'},
  iaido:{name:'발도술',icon:'⚔️',color:'#e8e8ff',desc:'삿갓과 일본도. 6.5초마다 가까운 상대를 향해 일직선으로 3연속 베기, 각 피해 12'},
  tornado:{name:'회오리',icon:'🌪️',color:'#4fd1c5',desc:'바람개비와 부채. 6초마다 회오리로 주위 상대를 1초 빨아들였다가 사방으로 날려버림, 피해 15'},
  snipe:{name:'저격',icon:'🎯',color:'#8bc34a',desc:'베레모와 저격총. 7.5초마다 1.5초 조준 뒤 맵 어디든 한 발, 피해 40. 조준 중엔 못 움직임'},

// 점 (x,y)에서 가로 중심선 [-L,L] 까지의 거리 (경기장/자기장 경계 판정용)
const segDist=(x,y,L)=>Math.hypot(x-clamp(x,-L,L),y);

// 구조물 경계에서 가장 가까운 점과 거리, 내부 여부
function obstClosest(o,x,y){
  let bd=Infinity,bx=0,by=0,inside=true;const n=o.pts.length;
  for(let i=0;i<n;i++){
    const [ax,ay]=o.pts[i],[cx,cy]=o.pts[(i+1)%n];const ex=cx-ax,ey=cy-ay;
    let t=((x-ax)*ex+(y-ay)*ey)/(ex*ex+ey*ey);t=clamp(t,0,1);
    const px=ax+ex*t,py=ay+ey*t,d=(x-px)**2+(y-py)**2;
    if(d<bd){bd=d;bx=px;by=py}
    if((ex*(y-ay)-ey*(x-ax))*o.sign<0)inside=false;
  }
  if(n<3)inside=false; // 점 2개짜리 벽은 내부가 없음
  return {px:bx,py:by,d:Math.sqrt(bd),inside};
}

const hitsObst=(x,y,pad)=>OB.some(o=>{const c=obstClosest(o,x,y);return c.inside||c.d<o.rc+pad});

// ---------- 블랙홀 모드: 가운데로 나선형으로 빨려 들어감, 빨려 들어가면 탈락, 마지막까지 버틴 공이 승리 ----------
const isHole=()=>opt.game==='hole';
const HOLE={R:360,r0:42,pull:180,grow:1.3,esc:215}; // R 바닥 반지름, r0 블랙홀 반지름, pull 기본 흡인력(초당 grow씩 증가), esc 공이 버티는 힘
function holeMove(m,dt){
  const d=Math.hypot(m.x,m.y)||1,rx=m.x/d,ry=m.y/d,tx=-ry,ty=rx; // rx,ry 바깥 방향 / tx,ty 시계 방향 접선
  m.dist=d;m.prog=d;
  m.escT-=dt;if(m.escT<=0){m.escT=rand(1,2.5);m.escTarget=rand(0.8,1.15)}m.esc+=(m.escTarget-m.esc)*Math.min(1,dt*1.5);
  m.stun=Math.max(0,m.stun-dt);m.slow=Math.max(0,m.slow-dt);m.boost=Math.max(0,m.boost-dt);
  const g=(HOLE.pull+HOLE.grow*S.time)*Math.sqrt(HOLE.R/Math.max(d,40)); // 안쪽일수록 강하게 당김
  let esc=HOLE.esc*m.esc*m.speedMul*(m.boost>0?1.5:1)*(m.slow>0?0.4:1);if(m.stun>0||m.frozen>0)esc=0;
  m.wob+=rand(-1,1)*4*dt;const w=Math.sin(m.wob)*0.5;
  m.vx+=(rx*(esc-g)+tx*(70+esc*w*0.6))*dt;m.vy+=(ry*(esc-g)+ty*(70+esc*w*0.6))*dt; // 접선 성분은 약하게 (세면 원심력으로 바깥 벽에 눌러붙어 절대 안 빨려 들어감)
}
const RACE={halfW:180,base:320,W:900,H:480,R:180,pts:[],seg:[],L:0}; // base: 기본 주행 속도 (고무줄 보정으로 뒤처지면 +25%, 혼자 앞선 선두는 -10%)
function buildTrack(){
  const w=RACE.W,h=RACE.H,rr=RACE.R,pts=[];const add=(x,y)=>pts.push([x,y]);
  const arc=(cx,cy,a0,a1)=>{const n=12;for(let i=1;i<=n;i++){const a=a0+(a1-a0)*i/n;add(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}};
  add(-(w/2-rr),-h/2);add(w/2-rr,-h/2);arc(w/2-rr,-(h/2-rr),-Math.PI/2,0);add(w/2,h/2-rr);arc(w/2-rr,h/2-rr,0,Math.PI/2);
  add(-(w/2-rr),h/2);arc(-(w/2-rr),h/2-rr,Math.PI/2,Math.PI);add(-w/2,-(h/2-rr));arc(-(w/2-rr),-(h/2-rr),Math.PI,Math.PI*1.5);
  pts.pop(); // 마지막 점은 시작점과 같음
  RACE.pts=pts;RACE.seg=[];let s0=0;
  for(let i=0;i<pts.length;i++){const [ax,ay]=pts[i],[bx,by]=pts[(i+1)%pts.length];const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1e-6;RACE.seg.push({ax,ay,bx,by,dx,dy,len,s0,tx:dx/len,ty:dy/len});s0+=len}
  RACE.L=s0;
}
buildTrack();

// 트랙 위 위치: 진행 거리 s, 중심선에서의 옆 거리 lat(+는 진행 방향 기준 왼쪽 법선), 접선 tx/ty
function trackPos(x,y){let best=Infinity,bs=0,bl=0,bt=null;
  for(const g of RACE.seg){let t=((x-g.ax)*g.dx+(y-g.ay)*g.dy)/(g.len*g.len);t=clamp(t,0,1);const px=g.ax+g.dx*t,py=g.ay+g.dy*t;const d=(x-px)**2+(y-py)**2;
    if(d<best){best=d;bs=g.s0+t*g.len;bl=(x-px)*(-g.ty)+(y-py)*g.tx;bt=g}}

function parseNames(text){
  const out=[];
  text.split(/[\n,]/).map(s=>s.trim()).filter(Boolean).forEach(tok=>{
    let name=tok,cnt=1;
    const m=tok.match(/^(.*?)\s*[*xX×]\s*(\d+)$/);
    if(m&&m[1].trim()){name=m[1].trim();cnt=clamp(parseInt(m[2],10)||1,1,500)}
    for(let k=0;k<cnt;k++)out.push(name);
  });
  return out.slice(0,1000);
}

        const dx=t.x-m.x,dy=t.y-m.y,L=Math.hypot(dx,dy)||1;

      m.skillCd=BAL.waveCd;break;
    case 'frost':{ // 얼음 창: 상대 쪽으로 날아가며 궤적에 닿는 모두를 얼림 (관통)

        S.arrows.push({x:m.x+dx/L*(m.r+6),y:m.y+dy/L*(m.r+6),vx:dx/L*720,vy:dy/L*720,owner:m,life:0.8});

      let t=null;if(isRace()||isHole()){for(const o of foes)if(!t||o.prog>t.prog)t=o}else for(const o of foes)if(!t||o.hp<t.hp)t=o; // 레이스는 1등, 블랙홀은 가장 바깥 공을 조준
      if(t){announce(m);m.aim={t:0,dur:1.5,target:t};m.vx*=0.3;m.vy*=0.3;m.skillCd=BAL.snipeCd}else m.skillCd=0.5;

        S.boomerangs.push({x:m.x+ux*(m.r+6),y:m.y+uy*(m.r+6),vx:ux*540-uy*170,vy:uy*540+ux*170,owner:m,t:0,rot:0,hitOut:new Set(),hitBack:new Set()});

  }
}
// 발동형 스킬만 연출(카메라 이동 + 0.7배속)을 붙인다. 화염검/흡혈은 상시 효과
const ACTIVE=new Set(['shield','bolt','blink','wave','frost','magnet','arrow','bomb','laser','hammer','iaido','tornado','snipe','boomerang','breath','bees','rocket']);
function canUse(m,alive){
  const foes=alive.filter(o=>isFoe(m,o));if(!foes.length)return false;
  const near=range=>foes.some(o=>(o.x-m.x)**2+(o.y-m.y)**2<range*range);
  switch(m.skill){
    case 'shield':return !m.shield;
    case 'bolt':return near(300);
    case 'frost':return near(340);
    case 'arrow':return near(380);
    case 'wave':return near(220);
    case 'magnet':return near(170);
    case 'bomb':return near(260);
    case 'laser':return near(600);
    case 'hammer':return near(130);
    case 'iaido':return near(420);
    case 'tornado':return near(200);
    case 'snipe':return true;
    case 'boomerang':return near(400);
    case 'breath':return near(200);
    case 'bees':return near(320);
    case 'rocket':return near(500);
    case 'blink':return true;
    default:return false;
  }
}
function startFocus(m){
  const s=SKILLS[m.skill];
  S.focus={m,t:0,fired:false};
  addText(m.x,m.y-m.r-26,`${s.icon} ${s.name}!`,s.color,16);
}
// 로켓 돌진 폭발: 반경 110, 벽에 부딪혔으면 자기도 피해
function rocketBoom(m,kind){m.rocketT=0;m.rocketTarget=null;const x=m.x,y=m.y,sc=SKILLS.rocket.color;
  ring(x,y,16,900,0,0.4,sc,true,110);burst(x,y,40,'#ffb347',320);burst(x,y,20,'#ff4d6d',220);burst(x,y,12,'#fff',160);addText(x,y-m.r-16,'💥 로켓 폭발',sc,22);
  for(const o of aliveList()){if(!isFoe(m,o))continue;const dx=o.x-x,dy=o.y-y,d=Math.hypot(dx,dy);if(d<110+o.r&&d>0){shove(o,dx/d*500,dy/d*500);hurt(o,BAL.rocketDmg,m,o.x,o.y)}}
  m.vx*=0.15;m.vy*=0.15;m.fling=0;

function explodeBomb(b){
  ring(b.x,b.y,20,1000,0,0.45,'#ff7a3d',true,150);ring(b.x,b.y,20,1300,4,0.5,'#ffb347',false,240);

}

// ---------- 시뮬레이션 ----------
function step(dt){
  if(S.phase==='countdown'){S.countdown-=dt;if(S.countdown<=0){S.phase='battle';S.fight=1;addFeed('⚔️ 전투 시작!')}return}
  if(S.phase!=='battle')return;
  S.time+=dt;
  const alive=aliveList();const na=alive.length;
  if(!S.final&&na<=opt.finalAt&&S.time>1)enterFinal(alive);
  if(S.final)S.finalT+=dt;
  if(S.final&&!S.duel&&na===2&&S.time>1&&!isRace()&&!isHole())enterDuel(alive); // 레이스는 1:1 연출 없음 (체력이 없으므로)
  if(S.duel)S.duelT+=dt;
  S.zoneHold=Math.max(0,S.zoneHold-dt);
  const race=isRace(),hole=isHole(),zoneOn=opt.zone&&!race&&!hole;
  if(hole&&rng()<0.6){const a=rand(0,TAU),rad=rand(HOLE.r0+10,HOLE.R);S.particles.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad,vx:-Math.cos(a)*90-Math.sin(a)*140,vy:-Math.sin(a)*90+Math.cos(a)*140,life:rand(0.5,1.1),color:rng()<0.5?'#b388ff':'#6a4fbf',r:rand(1,2.5)})} // 블랙홀로 흘러드는 먼지
  if(race){let p1=-Infinity,p2=-Infinity;for(const m of alive){if(m.prog>p1){p2=p1;p1=m.prog}else if(m.prog>p2)p2=m.prog}S.raceLead=p1;S.raceGap2=p2===-Infinity?0:p1-p2} // 선두 진행도와 2등과의 격차 (고무줄 보정용)
  if(zoneOn&&S.time>CFG.zoneGrace&&S.zoneHold<=0){const rate=na<=3?CFG.zoneRateFinal:CFG.zoneRate;S.zoneR=Math.max(CFG.zoneMinR,S.zoneR-rate*dt)}
  const zl=zoneL();
  S.bombs=S.bombs.filter(b=>{b.t-=dt;if(rng()<0.3)S.particles.push({x:b.x+rand(-3,3),y:b.y-10,vx:rand(-40,40),vy:rand(-90,-30),life:rand(0.15,0.35),color:'#ffe66d',r:rand(1,2)});if(b.t>0)return true;explodeBomb(b);return false});
  S.arrows=S.arrows.filter(a=>{a.life-=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;
    if(rng()<0.6)S.particles.push({x:a.x,y:a.y,vx:rand(-20,20),vy:rand(-20,20),life:rand(0.2,0.35),color:SKILLS.arrow.color,r:rand(1.5,3)}); // 화살 궤적
    if(a.life<=0||outOfArena(a.x,a.y,0)||hitsObst(a.x,a.y,2)){spark(a.x,a.y,6);return false}
    for(const o of alive){if(!isFoe(a.owner,o))continue;
      if((o.x-a.x)**2+(o.y-a.y)**2<(o.r+7)**2){const L=Math.hypot(a.vx,a.vy)||1;shove(o,a.vx/L*180,a.vy/L*180);
        burst(o.x,o.y,24,SKILLS.arrow.color,260);hurt(o,BAL.arrowDmg,a.owner,o.x,o.y);return false}}
    return true});
  // 얼음 창: 관통하며 궤적의 상대를 얼림
  S.spears=S.spears.filter(a=>{a.life-=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;
    if(rng()<0.7)S.particles.push({x:a.x+rand(-3,3),y:a.y+rand(-3,3),vx:rand(-30,30),vy:rand(-30,30),life:rand(0.25,0.45),color:rng()<0.5?'#dff7ff':SKILLS.frost.color,r:rand(1.5,3)});
    if(a.life<=0||outOfArena(a.x,a.y,0)||hitsObst(a.x,a.y,2)){burst(a.x,a.y,14,'#dff7ff',160);return false}
    for(const o of alive){if(!isFoe(a.owner,o)||a.hit.has(o))continue;
      if((o.x-a.x)**2+(o.y-a.y)**2<(o.r+9)**2){a.hit.add(o);o.frozen=1.2;o.vx*=0.2;o.vy*=0.2;if(BAL.frostDmg>0)hurt(o,BAL.frostDmg,a.owner,o.x,o.y);burst(o.x,o.y,26,SKILLS.frost.color,170);burst(o.x,o.y,10,'#fff',100);if(S.final)addText(o.x,o.y-o.r-10,'❄️ 빙결',SKILLS.frost.color,16)}}
    return true});
  // 부메랑: 주인 쪽으로 계속 당겨져 곡선을 그리며 돌아옴. 나가는 길·돌아오는 길에 각각 한 번씩 피해
  S.boomerangs=S.boomerangs.filter(b=>{b.t+=dt;b.rot+=22*dt;const o=b.owner;
    const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||1;b.vx+=dx/d*700*dt;b.vy+=dy/d*700*dt;
    const sp=Math.hypot(b.vx,b.vy);if(sp>640){b.vx*=640/sp;b.vy*=640/sp}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(rng()<0.5)S.particles.push({x:b.x,y:b.y,vx:rand(-20,20),vy:rand(-20,20),life:rand(0.2,0.35),color:SKILLS.boomerang.color,r:rand(1.5,3)});
    if(!o.alive||b.t>2.4||(b.t>0.35&&d<o.r+10)){if(o.alive)burst(b.x,b.y,8,SKILLS.boomerang.color,120);return false}
    if(outOfArena(b.x,b.y,4)||hitsObst(b.x,b.y,4)){spark(b.x,b.y,8);b.vx=dx/d*500;b.vy=dy/d*500} // 벽에 맞으면 바로 돌아옴
    const out=(b.vx*dx+b.vy*dy)<0;const set=out?b.hitOut:b.hitBack;
    for(const t of alive){if(!isFoe(o,t)||set.has(t))continue;if((t.x-b.x)**2+(t.y-b.y)**2<(t.r+12)**2){set.add(t);const L=Math.hypot(b.vx,b.vy)||1;shove(t,b.vx/L*220,b.vy/L*220);burst(t.x,t.y,18,SKILLS.boomerang.color,220);spark(t.x,t.y,6);hurt(t,BAL.boomDmg,o,t.x,t.y)}}
    return true});
  // 벌떼: 상대 주위를 윙윙 돌며 0.3초마다 2 (방패 무시). 상대가 죽으면 근처 다른 상대에게
  S.swarms=S.swarms.filter(sw=>{sw.t-=dt;let t=sw.target;
    if(!t||!t.alive){let best=null,bd=200*200;const b0=sw.bees[0];for(const o of alive){if(!isFoe(sw.owner,o))continue;const d=(o.x-b0.x)**2+(o.y-b0.y)**2;if(d<bd){bd=d;best=o}}sw.target=t=best}
    if(!t||sw.t<=0||!sw.owner.alive){for(const b of sw.bees)burst(b.x,b.y,2,SKILLS.bees.color,80);return false}
    for(const b of sw.bees){b.ph+=dt*9;const gx=t.x+Math.cos(b.ph)*(t.r+10),gy=t.y+Math.sin(b.ph*1.3)*(t.r+10);const dx=gx-b.x,dy=gy-b.y,d=Math.hypot(dx,dy)||1;const sp=Math.min(900,d*12+200);b.vx=dx/d*sp+rand(-60,60);b.vy=dy/d*sp+rand(-60,60);b.x+=b.vx*dt;b.y+=b.vy*dt}
    sw.tick-=dt;const near=sw.bees.some(b=>(b.x-t.x)**2+(b.y-t.y)**2<(t.r+16)**2);
    if(near&&sw.tick<=0){sw.tick=0.3;if(isRace())t.slow=Math.max(t.slow,0.5);else t.hp-=BAL.beeDmg;t.beeDmg+=BAL.beeDmg;t.hit=Math.max(t.hit,0.4);S.hits++;S.dmgTotal+=BAL.beeDmg;spark(t.x+rand(-t.r,t.r),t.y+rand(-t.r,t.r),2);if(t.hp<=0)die(t,sw.owner)}
    return true});
  // 불길: 밟는 상대에게 지속 피해 (방패 무시, 0.3초마다 4)
  for(const f of S.fires){for(const o of alive){if(!isFoe(f.owner,o)||o.fireCd>0)continue;
    if((o.x-f.x)**2+(o.y-f.y)**2<(o.r+f.r*0.7)**2){o.fireCd=0.3;if(isRace())o.slow=Math.max(o.slow,0.6);else o.hp-=BAL.fireDmg;o.fireDmg+=BAL.fireDmg;o.hit=Math.max(o.hit,0.5);S.hits++;S.dmgTotal+=BAL.fireDmg;burst(o.x,o.y,4,'#ff7a3d',120);if(o.hp<=0)die(o,f.owner)}}}

  for(const m of alive){
    if(!m.alive)continue;
    m.px=m.x;m.py=m.y; // 이전 위치 (렌더 보간용)

        let atk=sa>=sb?a:b; // 더 빠르게 들이받은 쪽이 공격자. 자석이 당기는 중이면 끌려온 쪽이 아니라 자석 쪽이 공격자
        if(a.magnetT>0&&b.magnetT<=0)atk=a;else if(b.magnetT>0&&a.magnetT<=0)atk=b;
        const def=atk===a?b:a;
        const mul=(atk.skill==='flame'?BAL.flameMul:1)*(atk.skill==='giant'?BAL.giantDmg:1)*(atk.magnetT>0?BAL.magnetMul:1);
        if(def.inv<=0){hurt(def,base*mul*rand(0.8,1.2),atk,cx,cy);def.inv=CFG.hitInv;
          if(S.final)burst(cx,cy,12,atk.skill==='flame'?'#ff7a3d':'#fff',240)
          if(S.final&&atk.skill==='flame')flameSwing(atk,Math.atan2(def.y-atk.y,def.x-atk.x))}
        // 상대를 쓰러뜨렸으면 반격 피해 없음 (더블 KO 방지)
        if(def.alive&&atk.inv<=0){hurt(atk,base*CFG.counterRatio*rand(0.8,1.2),def,cx,cy);atk.inv=CFG.hitInv}
        // 맞부딪힌 뒤 반동: 잠시 추적을 멈추고 서로 튕겨 나감
        atk.recoil=CFG.recoil;def.recoil=CFG.recoil;
        a.vx-=nx*CFG.recoilKick;a.vy-=ny*CFG.recoilKick;b.vx+=nx*CFG.recoilKick;b.vy+=ny*CFG.recoilKick;
        // 거인화: 자기를 들이받은 상대를 멀리 튕겨냄
        if(def.skill==='giant'&&def.alive&&atk.alive){const sg=atk===a?-1:1;atk.vx=0;atk.vy=0;shove(atk,sg*nx*1100,sg*ny*1100);atk.fling=0.5;burst(cx,cy,16,SKILLS.giant.color,220);if(S.final)addText(atk.x,atk.y-atk.r-24,'🗿 튕겨냄!',SKILLS.giant.color,16)}
        spark(cx,cy,S.final?Math.min(10,3+rel/60):Math.min(4,1+rel/150));
      }
    }
  }

  // 벽 + 구조물 + 자기장
  for(const m of alive){if(!m.alive)continue;
    if(hole){ // 블랙홀: 바깥 벽, 가운데로 들어가면 탈락
      const d=Math.hypot(m.x,m.y)||1,rx=m.x/d,ry=m.y/d;
      if(d+m.r>HOLE.R){m.x=rx*(HOLE.R-m.r);m.y=ry*(HOLE.R-m.r);const vn=m.vx*rx+m.vy*ry;if(vn>0){m.vx-=vn*rx*1.5;m.vy-=vn*ry*1.5}}
      if(d<HOLE.r0+m.r*0.3){burst(m.x,m.y,18,'#b388ff',200);addText(m.x,m.y-m.r-14,'빨려 들어감',m.color,18);die(m,null,'hole');continue}
    }else if(race){ // 트랙 가장자리: 밀어 넣고, 세게 부딪히면 잠깐 정지
      const tp=trackPos(m.x,m.y);const hw=halfWAt(tp.s)-m.r;
      if(Math.abs(tp.lat)>hw){const sg=Math.sign(tp.lat),nx=-tp.ty,ny=tp.tx,over=(Math.abs(tp.lat)-hw)*sg;m.x-=nx*over;m.y-=ny*over;
        const vn=m.vx*nx+m.vy*ny;if(vn*sg>0){m.vx-=vn*nx*1.6;m.vy-=vn*ny*1.6;if(Math.abs(vn)>220){m.stun=Math.max(m.stun,0.25);spark(m.x+nx*m.r*sg,m.y+ny*m.r*sg,6)}}}
    }else{
    const wx=clamp(m.x,-ARENA_L,ARENA_L);let dw=Math.hypot(m.x-wx,m.y);
    if(dw+m.r>ARENA_R){
      if(dw<1e-6)dw=1e-6;const nx=(m.x-wx)/dw,ny=m.y/dw;
      m.x=wx+nx*(ARENA_R-m.r);m.y=ny*(ARENA_R-m.r);
      const vn=m.vx*nx+m.vy*ny;if(vn>0){m.vx-=(1+CFG.restitution)*vn*nx;m.vy-=(1+CFG.restitution)*vn*ny}
    }}
    for(const o of OB){
      const c=obstClosest(o,m.x,m.y);const R=m.r+o.rc;
      if(!c.inside&&c.d>=R)continue;
      let ux=m.x-c.px,uy=m.y-c.py;const d=Math.hypot(ux,uy);
      if(d<1e-6){ux=0;uy=-1}else{ux/=d;uy/=d}
      if(c.inside){ux=-ux;uy=-uy}
      m.x=c.px+ux*R;m.y=c.py+uy*R;
      const vn=m.vx*ux+m.vy*uy;if(vn<0){m.vx-=(1+CFG.restitution)*vn*ux;m.vy-=(1+CFG.restitution)*vn*uy}
    }
    const dz=segDist(m.x,m.y,zl);
    if(zoneOn&&dz+m.r>S.zoneR){m.burn=1;m.hp-=CFG.zoneDps*(1+S.time/60)*dt;if(m.hp<=0)die(m,null)}
    else m.burn=Math.max(0,m.burn-dt*3);
  }
  // 레이스: 선두가 한 바퀴를 돌 때마다 꼴찌 탈락 (결전 전엔 여러 명, 결전부터 한 명씩)
  if(race){let lead=0;for(const m of alive)if(m.alive&&m.lap>lead)lead=m.lap;
    if(lead>S.raceLap){S.raceLap=lead;const live=alive.filter(m=>m.alive),n=live.length,k=lead>=2?raceK(n):0; // 첫 바퀴는 자리 잡는 시간, 탈락 없음
      if(lead===1)S.banner={text:'🏁 LAP 1',sub:'첫 바퀴는 탈락 없음  ·  다음 바퀴부터 꼴찌 탈락',age:0,life:1.8};
      if(k>0){const sorted=live.slice().sort((a,b)=>a.prog-b.prog);
        for(let i=0;i<k;i++){const m=sorted[i];boom(m,1.2);addText(m.x,m.y-m.r-14,'꼴찌!',m.color,20);die(m,null,'race')}
        S.banner={text:`🏁 LAP ${lead}`,sub:`꼴찌 ${k}명 탈락  ·  남은 ${n-k}명`,age:0,life:1.6}}}}
  checkEnd();
}

function hurt(m,dmg,by,cx,cy){
  if(!m.alive)return;
  if(m.shield&&by){m.shield=false;m.shieldFx=0.5;burst(cx,cy,24,'#7fd3ff',260);if(S.final)addText(cx,cy-12,'🛡️ BLOCK','#7fd3ff',18);return}
  if(m.frozen>0)dmg*=BAL.frozenMul;
  dmg=Math.min(dmg,CFG.dmgCap);
  let crit=false;if(rng()<CFG.critChance){dmg*=2;crit=true}
  dmg=Math.round(dmg);if(dmg<=0)return;
  if(isRace()||isHole()){ // 레이스·블랙홀: 체력 대신 잠깐 정지 + 뒤로(안쪽으로) 밀림 (피해량만큼). 흡혈은 대신 가속
    m.stun=Math.max(m.stun,Math.min(1.0,dmg*0.025));m.hit=1;S.hits++;S.dmgTotal+=dmg;S.lastDmgT=S.time;
    if(isHole()){const d=Math.hypot(m.x,m.y)||1;shove(m,-m.x/d*dmg*7,-m.y/d*dmg*7)}else if(m.tx!==undefined)shove(m,-m.tx*dmg*7,-m.ty*dmg*7);
    if(S.final)addText(cx+rand(-8,8),cy-10+rand(-6,6),(crit?'💥':isHole()?'🌀':'🐌')+' -'+dmg,crit?'#ffd166':'#fff',crit?24:17);
    if(by&&by.alive&&by.skill==='drain'){by.boost=Math.max(by.boost,0.8);if(S.final)addText(by.x,by.y-by.r-8,'🩸 가속','#5be38b',16)}
    return}
  m.hp-=dmg;m.hit=1;S.hits++;S.dmgTotal+=dmg;
  if(S.final)addText(cx+rand(-8,8),cy-10+rand(-6,6),(crit?'💥':'')+'-'+dmg,crit?'#ffd166':'#fff',crit?24:17);
  if(by&&by.alive&&by.skill==='drain'){const heal=Math.round(dmg*BAL.drainHeal);if(heal>0&&by.hp<by.hpMax){by.hp=Math.min(by.hpMax,by.hp+heal);
    const dx=by.x-m.x,dy=by.y-m.y,d=Math.hypot(dx,dy)||1;for(let k=0;k<8;k++)S.particles.push({x:m.x+rand(-6,6),y:m.y+rand(-6,6),vx:dx/d*rand(200,380),vy:dy/d*rand(200,380),life:rand(0.25,0.45),color:'#ff4d6d',r:rand(1.5,3)});
    for(let k=0;k<9;k++){const a=rand(-2.6,-0.5);S.particles.push({x:cx,y:cy,vx:Math.cos(a)*rand(60,220),vy:Math.sin(a)*rand(60,220)+120,life:rand(0.35,0.6),color:k%2?'#c8102e':'#ff2d55',r:rand(2,4)})} // 피 튀김
    burst(by.x,by.y,12,'#5be38b',120);if(S.final)addText(by.x,by.y-by.r-8,'🩸 +'+heal,'#5be38b',16)}}
  if(m.hp<=0)die(m,by);
}
function die(m,by,reason){
  if(!m.alive)return;
  m.alive=false;m.hp=0;m.killer=by;S.eliminated.push(m);m.rank=S.marbles.length-S.eliminated.length+1;
  if(by)by.kills++;
  if(S.focus&&S.focus.m===m)S.focus=null;
  // 결전에서 마지막 상대가 쓰러지는 순간: 결정타 연출
  if(S.final&&aliveList().length===1){S.finish={t:0,dur:2.2,x:m.x,y:m.y};S.focus=null;S.showdown=null}
  boom(m,S.final?3:0.45);
  if(S.final)addText(m.x,m.y-m.r-14,'탈락',m.color,22);
  const me=`<b style="color:${m.color}">${esc(m.label)}</b>`;
  addFeed(by?`<b style="color:${by.color}">${esc(by.label)}</b> ⚔ ${me} 탈락`:reason==='race'?`🏁 꼴찌로 ${me} 탈락`:reason==='hole'?`🌀 블랙홀에 빨려 들어가 ${me} 탈락`:`🌀 자기장 ⚔ ${me} 탈락`);
  const f=m.faction;f.alive--;
  if(f.alive<=0&&!f.out)factionOut(f,m);
  checkBars(false);
}
function factionOut(f,m){
  f.out=true;f.outAnim=1.4;S.factionsOut.push(f);f.rank=S.factions.length-S.factionsOut.length+1;
  shatterBar(f);
  if(S.final)boom(m,1.5);else burst(m.x,m.y,16,f.color,220);
  if(!S.single){S.toasts.push({text:`${f.name} 탈락`,sub:`${f.rank}위  ·  남은 팀 ${factionsAlive()}`,color:f.color,life:4,max:4});if(S.toasts.length>10)S.toasts.shift()}
  addFeed(`💥 <b style="color:${f.color}">${esc(f.name)}</b> 탈락 (${f.rank}위)`,'big');
}

function ranking(){
  const alive=aliveList().sort((a,b)=>b.hp-a.hp||a.i-b.i);
  return alive.concat([...S.eliminated].reverse());
}
function factionRanking(){
  const alive=S.factions.filter(f=>!f.out).sort((a,b)=>b.alive-a.alive||fhp(b)-fhp(a));
  return alive.concat([...S.factionsOut].reverse());
}
function checkEnd(){
  const fa=factionsAlive();
  if(!S.determined){
    let w=null;
    if(opt.mode==='first'&&fa<=1)w=factionRanking().slice(0,1);
    else if(opt.mode==='last'&&S.factionsOut.length>=1)w=[S.factionsOut[0]];
    else if(opt.mode==='multi'){const k=clamp(parseInt(multiN.value,10)||1,1,S.factions.length);if(fa<=k)w=factionRanking().slice(0,k)}
    if(w){S.determined=true;S.winners=w;w.forEach(f=>{f.win=true;f.members.forEach(m=>m.win=true)});
      addFeed('🏆 당첨: '+w.map(f=>`<b style="color:${f.color}">${esc(f.name)}</b>`).join(', '),'gold')}
  }
  if(fa<=1&&S.phase==='battle'){
    S.phase='finished';
    const names=S.winners.map(f=>f.name).join(', ');
    S.bannerDelay=S.finish?2.6:0.9; // 결정타/탈락 연출 뒤에 승리 배너
    S.bannerNext=opt.mode==='first'
      ?{text:`🏆 ${names} 승리!`,sub:`LAST ONE STANDING  ·  ${fmt(S.time)}`}
      :{text:`🏆 ${names} 당첨!`,sub:`${opt.mode==='last'?'첫 탈락':'여러명'} 기준  ·  ${fmt(S.time)}`};
  }
}

// 순위 패널: 살아있는 줄은 매번 갱신, 탈락한 줄은 탈락자가 바뀔 때만 다시 그림 (DOM 부담 감소)
let deadKey=-1;
function updateRank(){
  const race=isRace(),hole=isHole(),n=S.marbles.length,alive=aliveList().sort((race||hole)?(a,b)=>b.prog-a.prog||a.i-b.i:(a,b)=>b.hp-a.hp||a.i-b.i),na=alive.length,max=80; // 레이스는 진행도 순, 블랙홀은 바깥에 있을수록 앞
  rankHead.textContent=`생존 ${na} / ${n}`;
  rankAlive.innerHTML=alive.slice(0,max).map((m,i)=>`<div class="row ${m.win?'win':''}"><span class="rk">${i+1}</span><span class="dot" style="background:${opt.faces&&S.faceOf&&S.faceOf[m.name]?`url(${FACE_IMAGES[S.faceOf[m.name]]}) center/cover`:m.color}"></span><span class="nm" title="${esc(m.label)}"${m.win?'':` style="color:${m.color}"`}>${m.skill?SKILLS[m.skill].icon+' ':''}${esc(m.label)}</span><span class="hp"><i style="width:${race?clamp(m.s/RACE.L*100,0,100):hole?clamp(m.dist/HOLE.R*100,0,100):clamp(m.hp/m.hpMax*100,0,100)}%;background:${race?'#ffd166':hole?'#b388ff':hpColor(m.hp/m.hpMax*100)}"></i></span></div>`).join('');
  const key=S.eliminated.length*1000+Math.min(na,max)+(S.winners.length?500000:0);
  if(key!==deadKey){deadKey=key;
    const dead=[...S.eliminated].reverse(),room=Math.max(0,max-Math.min(na,max));
    rankDead.innerHTML=dead.slice(0,room).map((m,i)=>`<div class="row dead ${m.win?'win':''}"><span class="rk">${na+i+1}</span><span class="dot"></span><span class="nm" title="${esc(m.label)}"${m.win?'':` style="color:${m.color}"`}>${esc(m.label)}</span><span class="rk">#${m.rank}</span></div>`).join('')
      +(dead.length>room?`<div class="row" style="color:var(--muted)">… 외 ${dead.length-room}명</div>`:'');
  }
}
function addFeed(html,cls){S.feed.push(`<div${cls?` class="${cls}"`:''}>${html}</div>`);if(S.feed.length>60)S.feed.shift();feedEl.innerHTML=S.feed.join('');feedEl.scrollTop=feedEl.scrollHeight}

// ---------- 이펙트 갱신 ----------
function shatterBar(f){
  const r=barLayout().get(f);if(!r)return;
  const cols=6,rows=2,pw=r.w/cols,ph=r.h/rows,cx=r.x+r.w/2,cy=r.y+r.h/2;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const x=r.x+i*pw+pw/2,y=r.y+j*ph+ph/2,ang=Math.atan2(y-cy,x-cx),sp=Math.random()*260+120;
    S.shards.push({x,y,w:pw*(0.6+Math.random()*0.5),h:ph*(0.6+Math.random()*0.5),vx:Math.cos(ang)*sp+(Math.random()-0.5)*160,vy:Math.sin(ang)*sp-220-Math.random()*160,rot:Math.random()*TAU,vr:(Math.random()-0.5)*14,color:f.color,life:1.3+Math.random()*0.5});
  }
}
function confettiBurst(){
  const cols=['#ffd166','#ff4d6d','#4fd1c5','#c8b6ff','#5be38b','#ff7a3d','#7fd3ff'];
  for(let k=0;k<140;k++)S.confetti.push({x:Math.random()*W,y:-20-Math.random()*H*0.5,vx:(Math.random()-0.5)*80,vy:120+Math.random()*160,w:5+Math.random()*6,h:8+Math.random()*8,rot:Math.random()*TAU,vr:(Math.random()-0.5)*8,color:cols[k%cols.length],life:5+Math.random()*3});
}
function fx(dt){
  if(S.particles.length>500)S.particles.splice(0,S.particles.length-500);
  S.particles=S.particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.96;p.vy*=0.96;return p.life>0});
  S.texts=S.texts.filter(t=>{t.life-=dt;t.y-=40*dt;return t.life>0});
  S.shards=S.shards.filter(s=>{s.life-=dt;s.vy+=1100*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=s.vr*dt;return s.life>0});
  S.rings=S.rings.filter(r=>{r.life-=dt;r.r=Math.min(r.rmax,Math.max(0,r.r+(r.vr===undefined?520:r.vr)*dt));return r.life>0});
  S.slashes=S.slashes.filter(o=>{o.life-=dt;return o.life>0});
  S.lasers=S.lasers.filter(o=>{o.life-=dt;return o.life>0});
  S.fires=S.fires.filter(o=>{o.life-=dt;return o.life>0});
  S.bolts=S.bolts.filter(b=>{b.life-=dt;return b.life>0});
  S.ghosts=S.ghosts.filter(g=>{g.life-=dt;return g.life>0});
  S.confetti=S.confetti.filter(c=>{c.life-=dt;c.x+=(c.vx+Math.sin(c.rot*2)*40)*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;return c.life>0&&c.y<H+30});
  S.toasts=S.toasts.filter(t=>{t.life-=dt;return t.life>0});
  if(S.barsActive&&S.barsAnim<1)S.barsAnim=Math.min(1,S.barsAnim+dt*2);
  if(S.duel&&S.duelists)for(const m of S.duelists){const hp=Math.max(0,m.hp);m.hpTrail=(m.hpTrail===undefined||m.hpTrail<hp)?hp:Math.max(hp,m.hpTrail-dt*CFG.hpMax*0.35)}
  const lbTarget=S.finish?52:(S.focus||S.showdown)?28:0;S.letterbox+=(lbTarget-S.letterbox)*Math.min(1,dt*8);
  if(S.bannerDelay>0){S.bannerDelay-=dt;if(S.bannerDelay<=0&&S.bannerNext){S.banner={...S.bannerNext,age:0};S.bannerNext=null;confettiBurst()}}
  if(S.banner){S.banner.age+=dt;if(S.banner.life!==undefined){S.banner.life-=dt;if(S.banner.life<=0)S.banner=null}}
  for(const f of S.factions){
    if(f.outAnim>0)f.outAnim=Math.max(0,f.outAnim-dt);
    // 체력바가 깎일 때 흰색 잔상이 천천히 따라오도록
    const fr=f.out?0:clamp(fhp(f)/(f.total*CFG.hpMax),0,1);
    f.trail=(f.trail===undefined||f.trail<fr)?fr:Math.max(fr,f.trail-dt*0.35);
  }
}

// ---------- 카메라/렌더 ----------
let W=0,H=0,DPR=1;const vigCache={key:null,c:null};
function resize(){DPR=Math.min(1.5,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px'}
window.addEventListener('resize',resize);resize();
const barsOn=()=>S.barsActive&&S.barsAnim>0;
// 모바일(폭 820px 이하): 패널이 아래 시트로 내려가므로 경기장은 가로 전체, 세로는 시트 위까지
const isMobile=()=>W<=820;
const viewBottom=()=>isMobile()?Math.round(H*0.54)-36:H;
const region=()=>{const e=S.barsActive?(1-Math.cos(S.barsAnim*Math.PI))/2:0;const b=(BAR_H+BAR_Y+14)*e;const VB=viewBottom();return isMobile()?{L:8,R:W-8,T:10+b,B:VB-10-b}:{L:294,R:W-254,T:12+b,B:VB-12-b}};

function barLayout(){
  const {L,R}=region();const rects=new Map();const off=(1-S.barsAnim)*80;
  for(const side of ['top','bottom']){
    const list=S.factions.filter(f=>f.barred&&f.side===side);const n=list.length;if(!n)continue;
    const gap=isMobile()?4:10,w=Math.min(320,(R-L-gap*(n-1))/n),total=w*n+gap*(n-1),x0=(L+R)/2-total/2;
    const y=side==='top'?BAR_Y-off:viewBottom()-BAR_Y-BAR_H+off;
    list.forEach((f,i)=>rects.set(f,{x:x0+i*(w+gap),y,w,h:BAR_H}));
  }
  return rects;
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function updateCamera(dt){
  const {L,R,T,B}=region();
  const race=isRace(),hole=isHole(),AW=race?RACE.W/2+RACE.halfW+20:hole?HOLE.R+20:ARENA_L+ARENA_R,AH=race?RACE.H/2+RACE.halfW+20:hole?HOLE.R+20:ARENA_R;
  const fit=Math.max(0.08,Math.min((R-L)/(AW*2+40),(B-T)/(AH*2+40))); // 화면이 아주 작아져도(모바일 키보드 등) 0 이하로 내려가지 않게
  let tx=0,ty=0,tz=fit,speed=2.5;
  const alive=aliveList();
  const frame2=(list,pad,zmax)=>{let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
    for(const m of list){minx=Math.min(minx,m.x-m.r);maxx=Math.max(maxx,m.x+m.r);miny=Math.min(miny,m.y-m.r);maxy=Math.max(maxy,m.y+m.r)}
    const bw=maxx-minx+pad*2,bh=maxy-miny+pad*2;tz=clamp(Math.min((R-L)/bw,(B-T)/bh),fit,fit*zmax);tx=(minx+maxx)/2;ty=(miny+maxy)/2};
  let free=false; // true면 경기장 범위 제한 없이 대상을 정확히 화면 중앙에
  if(S.finish||S.phase==='finished'){ // 결정타/종료: 마지막 공을 화면 중앙에 (승리 박스 자리만큼 살짝 위)
    const w=alive[0];tz=fit*3.0;free=true;speed=3;
    if(w){tx=w.x;ty=w.y+50/tz}else if(S.finish){tx=S.finish.x;ty=S.finish.y}
  }
  else if(S.focus){tx=S.focus.m.x;ty=S.focus.m.y;tz=fit*2.6;speed=3}                                  // 스킬 연출: 그 공으로
  else if(S.showdown&&alive.length===2){frame2(alive,90,3.0);speed=3}                                  // 1:1 결정타 예감: 둘을 크게
  else if(S.phase==='battle'&&alive.length>0&&(alive.length<=opt.finalAt||race)){ // 결전 인원부터 카메라가 따라감 (1:1은 가장 가까이). 레이스는 항상 무리를 따라감
    frame2(alive,alive.length<=2?80:140,alive.length<=2?3.0:2.4)}
  if(tz>fit&&!free){const limX=AW-((R-L)/2)/tz*0.9,limY=AH-((B-T)/2)/tz*0.9;
    tx=limX>0?clamp(tx,-limX,limX):0;ty=limY>0?clamp(ty,-limY,limY):0}
  const k=1-Math.exp(-speed*dt);
  S.cam.x=lerp(S.cam.x,tx,k);S.cam.y=lerp(S.cam.y,ty,k);S.cam.zoom=lerp(S.cam.zoom,tz,k);
}

}
function drawToasts(R,T,B){

      ctx.save();ctx.translate(tx,ty);ctx.rotate(a);ctx.fillStyle='#ffcc00';ctx.fillRect(-r*0.45,-r*0.8,r*0.9,r*1.6);ctx.fillStyle='#222';ctx.fillRect(-r*0.45,-r*0.8,r*0.9,r*0.3);ctx.fillRect(-r*0.45,r*0.5,r*0.9,r*0.3);ctx.strokeStyle='#8a6a00';ctx.lineWidth=1.5;ctx.strokeRect(-r*0.45,-r*0.8,r*0.9,r*1.6);ctx.restore();
      break}
    case 'giant':{ // 나무 몽둥이 (오른쪽)
      const bx=x+r*0.8,by=y+r*0.5,tx=x+r*1.7,ty=y-r*1.3;ctx.strokeStyle='#8a5a2b';ctx.lineCap='round';ctx.lineWidth=Math.max(4,r*0.3);ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(tx,ty);ctx.stroke();
      ctx.lineWidth=Math.max(6,r*0.5);ctx.beginPath();ctx.moveTo(lerp(bx,tx,0.55),lerp(by,ty,0.55));ctx.lineTo(tx,ty);ctx.stroke();ctx.lineCap='butt';
      ctx.fillStyle='#5a3a1b';for(const q of [0.65,0.85]){ctx.beginPath();ctx.arc(lerp(bx,tx,q)+r*0.2,lerp(by,ty,q),r*0.09,0,TAU);ctx.fill()}
      break}
    case 'tornado':{ // 부채 (오른쪽)
      const fx=x+r*1.05,fy=y+r*0.5;ctx.fillStyle='#e6fffb';ctx.beginPath();ctx.moveTo(fx,fy);ctx.arc(fx,fy,r*1.2,-Math.PI*0.75,-Math.PI*0.1);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#4fd1c5';ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();for(let k=0;k<4;k++){const a=-Math.PI*0.75+k*Math.PI*0.65/3;ctx.moveTo(fx,fy);ctx.lineTo(fx+Math.cos(a)*r*1.2,fy+Math.sin(a)*r*1.2)}ctx.stroke();
      break}
    case 'boomerang':{ // 손에 든 부메랑 (왼쪽)
      ctx.save();ctx.translate(x-r*1.25,y+r*0.2);ctx.rotate(-0.6);ctx.lineCap='round';ctx.strokeStyle='#d4a24c';ctx.lineWidth=Math.max(3,r*0.28);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r*0.9,0);ctx.moveTo(0,0);ctx.lineTo(Math.cos(1.85)*r*0.9,Math.sin(1.85)*r*0.9);ctx.stroke();ctx.lineCap='butt';ctx.restore();break}
    case 'snipe':{ // 저격총 (오른쪽으로 길게, 조준 중엔 상대 쪽을 향함)
      let ang=-0.2;if(m.aim&&m.aim.target.alive)ang=Math.atan2(m.aim.target.y-y,m.aim.target.x-x);
      ctx.save();ctx.translate(x,y);ctx.rotate(ang);
      ctx.fillStyle='#4a3a2a';ctx.fillRect(r*0.2,-r*0.18,r*1.1,r*0.36);ctx.fillRect(r*0.5,r*0.1,r*0.3,r*0.5);
      ctx.fillStyle='#2b2b33';ctx.fillRect(r*1.2,-r*0.11,r*1.7,r*0.22);ctx.fillStyle='#5a5f6a';ctx.fillRect(r*0.7,-r*0.42,r*0.8,r*0.2);
      ctx.restore();break}
    case 'iaido':{ // 일본도 (왼쪽 허리에 칼집, 베는 중엔 오른쪽으로 빼든 칼)
      if(m.dash>0){const ux=Math.SQRT1_2,uy=-Math.SQRT1_2,hx=x+r*0.7,hy=y+r*0.3;ctx.strokeStyle='#222';ctx.lineWidth=Math.max(2,r*0.16);ctx.beginPath();ctx.moveTo(hx-ux*r*0.4,hy-uy*r*0.4);ctx.lineTo(hx,hy);ctx.stroke();
        ctx.strokeStyle='#e8e8ff';ctx.lineWidth=Math.max(2.5,r*0.2);ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+ux*r*2.4,hy+uy*r*2.4);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke()}
      else{ctx.strokeStyle='#1a1a22';ctx.lineWidth=Math.max(3,r*0.26);ctx.beginPath();ctx.moveTo(x-r*0.6,y+r*0.5);ctx.lineTo(x-r*2.0,y+r*1.1);ctx.stroke();ctx.strokeStyle='#c8b6ff';ctx.lineWidth=1;ctx.stroke();
        ctx.strokeStyle='#e8e8ff';ctx.lineWidth=Math.max(2,r*0.14);ctx.beginPath();ctx.moveTo(x-r*0.6,y+r*0.5);ctx.lineTo(x-r*0.1,y+r*0.3);ctx.stroke()}
      break}
  }
  // ---- HP 링 (항상 위) ----
  const lw=Math.max(1.5,r*0.2),rr=r+lw;
  ctx.lineWidth=lw;ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.arc(x,y,rr,0,TAU);ctx.stroke();
  if(isRace()){ctx.strokeStyle=m.stun>0?'#ff4d6d':m.boost>0?'#ffd166':'rgba(255,255,255,0.35)';ctx.beginPath();ctx.arc(x,y,rr,-Math.PI/2,-Math.PI/2+TAU*clamp(m.s/RACE.L,0,1));ctx.stroke()} // 레이스: 이번 바퀴 진행도 (정지 중 빨강, 부스트 노랑)
  else if(isHole()){ctx.strokeStyle=m.stun>0?'#ff4d6d':'#b388ff';ctx.beginPath();ctx.arc(x,y,rr,-Math.PI/2,-Math.PI/2+TAU*clamp(m.dist/HOLE.R,0,1));ctx.stroke()} // 블랙홀: 중심에서 떨어진 정도
  else{ctx.strokeStyle=hpColor(m.hp/m.hpMax*100);ctx.beginPath();ctx.arc(x,y,rr,-Math.PI/2,-Math.PI/2+TAU*clamp(m.hp/m.hpMax,0,1));ctx.stroke()}
  if(m.shield){ // 철벽: 천천히 도는 육각 방벽
    const hr=rr+9,rot=S.time*0.9;poly(x,y,hr,6,rot);ctx.fillStyle='rgba(127,211,255,0.14)';ctx.fill();ctx.strokeStyle=SKILLS.shield.color;ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1;poly(x,y,hr-4,6,rot);ctx.stroke()}
  if(m.shieldFx>0&&!m.shield){ctx.globalAlpha=m.shieldFx*1.6;ctx.strokeStyle=SKILLS.shield.color;ctx.lineWidth=3;poly(x,y,rr+9+(0.5-m.shieldFx)*40,6,S.time*0.9);ctx.stroke();ctx.globalAlpha=1}
  if(m.frozen>0){ // 빙결: 얼음 결정 (6갈래 별)
    ctx.beginPath();for(let i=0;i<12;i++){const a=-Math.PI/2+i*Math.PI/6,q=i%2?r*0.75:r+8;const px=x+Math.cos(a)*q,py=y+Math.sin(a)*q;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();
    ctx.fillStyle='rgba(159,232,255,0.4)';ctx.fill();ctx.strokeStyle='#dff7ff';ctx.lineWidth=2;ctx.stroke()}
  if(m.win){ctx.strokeStyle='#ffd166';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(x,y,rr+5,0,TAU);ctx.stroke();ctx.setLineDash([])}
  const fs=Math.max(clamp(r*0.95,7,14),12/S.cam.zoom); // 공이 작아져도 이름은 화면에서 최소 12px
  ctx.font=`700 ${fs}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillText(m.name,x+1,y+rr+3+1);ctx.fillText(m.name,x-1,y+rr+3+1);
  ctx.fillStyle=m.color;ctx.fillText(m.name,x,y+rr+3); // 이름은 공 색으로
  if(s){ctx.font=`700 ${Math.max(11/S.cam.zoom,fs*0.85)}px ${FONT}`;ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillText(`${s.icon} ${s.name}`,x+1,y+rr+4+fs+1);ctx.fillStyle=s.color;ctx.fillText(`${s.icon} ${s.name}`,x,y+rr+4+fs)}
}

function render(){
  if(W<2||H<2)return; // 창이 아직 크기를 못 받았거나 숨겨진 상태
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);
  const {L,R,T,B}=region();
  const cx=(L+R)/2,cy=(T+B)/2;
  ctx.save();
  ctx.translate(cx,cy);ctx.scale(S.cam.zoom,S.cam.zoom);ctx.translate(-S.cam.x,-S.cam.y);

  if(isRace()){ // 트랙: 둥근 사각형 도로, 좁은 구간, 중앙 점선, 부스터 패드, 출발선
    const path=()=>{ctx.beginPath();RACE.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath()};
    ctx.lineJoin='round';ctx.lineCap='round';
    path();ctx.lineWidth=RACE.halfW*2+14;ctx.strokeStyle=S.final?'#5a2a3a':'#3a3a52';ctx.stroke();
    path();ctx.lineWidth=RACE.halfW*2;ctx.strokeStyle=S.final?'#141019':'#1a1a26';ctx.stroke();
    path();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.setLineDash([18,18]);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=1;
    {const q=trackPoint(0);ctx.save();ctx.translate(q.x,q.y);ctx.rotate(Math.atan2(q.ty,q.tx));const n=10,cell=RACE.halfW*2/n;for(let i=0;i<n;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#fff':'#222';ctx.fillRect(-14+j*14,-RACE.halfW+i*cell,14,cell)}ctx.restore()}
    // 트랙 안쪽 문구
    ctx.fillStyle='rgba(255,255,255,0.22)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 40px ${FONT}`;ctx.fillText('SOOP 촌장 고봉 방송',0,-18);ctx.font=`700 24px ${FONT}`;ctx.fillText('많은 시청 부탁드립니다.',0,22);
    ctx.lineJoin='miter';ctx.lineCap='butt';
  }else if(isHole()){ // 블랙홀: 둥근 바닥, 안쪽으로 감기는 나선 팔, 가운데 블랙홀, 바깥 벽
    ctx.beginPath();ctx.arc(0,0,HOLE.R,0,TAU);ctx.fillStyle=S.final?'#0e0b14':'#12121b';ctx.fill();
    ctx.lineWidth=2;for(let k=0;k<3;k++){ctx.strokeStyle=`rgba(190,140,255,${0.10+0.05*k})`;ctx.beginPath();for(let i=0;i<=60;i++){const u=i/60,rad=HOLE.r0+u*(HOLE.R-HOLE.r0),ang=k*TAU/3+u*4.5+S.time*0.8;const px=Math.cos(ang)*rad,py=Math.sin(ang)*rad;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()}
    ctx.beginPath();ctx.arc(0,0,HOLE.r0+12,0,TAU);ctx.fillStyle='rgba(160,80,255,0.22)';ctx.fill();
    ctx.beginPath();ctx.arc(0,0,HOLE.r0,0,TAU);ctx.fillStyle='#000';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#b388ff';ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,HOLE.R,0,TAU);ctx.strokeStyle=S.final?'#5a2a3a':'#3a3a52';ctx.lineWidth=4;ctx.stroke();
  }else{
  // 경기장 바닥
  ctx.beginPath();stadiumPath(ARENA_L,ARENA_R);ctx.fillStyle=S.final?'#0e0b14':'#12121b';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-(ARENA_L+ARENA_R),0);ctx.lineTo(ARENA_L+ARENA_R,0);
  for(const gx of [-ARENA_L,0,ARENA_L]){ctx.moveTo(gx,-ARENA_R);ctx.lineTo(gx,ARENA_R)}ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.beginPath();ctx.arc(0,0,CENTER_R,0,TAU);ctx.stroke(); // 가운데 빈 원형 공간 표시
  ctx.strokeStyle='rgba(255,255,255,0.05)';

  if(opt.zone&&!isRace()&&!isHole()&&S.zoneR<ARENA_R-0.5){
    const zl=zoneL();
    ctx.beginPath();stadiumPath(ARENA_L,ARENA_R);stadiumPath(zl,S.zoneR);ctx.fillStyle='rgba(255,60,80,0.16)';ctx.fill('evenodd');
    ctx.beginPath();stadiumPath(zl,S.zoneR);ctx.strokeStyle='rgba(120,220,255,0.95)';ctx.lineWidth=2;
    ctx.setLineDash([8,6]);ctx.lineDashOffset=-S.time*30;ctx.stroke();ctx.setLineDash([]);
  }
  ctx.beginPath();stadiumPath(ARENA_L,ARENA_R);ctx.strokeStyle=S.final?'#5a2a3a':'#3a3a52';ctx.lineWidth=4;ctx.stroke();
  }
  // 구조물
  ctx.lineJoin='round';ctx.lineCap='round';
  for(const o of OB){
    ctx.beginPath();o.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(o.pts.length>2)ctx.closePath();
    ctx.lineWidth=o.rc*2+4;ctx.strokeStyle=S.final?'#5a2a3a':'#3d3d58';ctx.stroke();
    ctx.lineWidth=o.rc*2;ctx.strokeStyle='#22222f';ctx.stroke();if(o.pts.length>2){ctx.fillStyle='#22222f';ctx.fill()}
  }
  ctx.lineJoin='miter';ctx.lineCap='butt';

  // 결전: 잔상 꼬리
  if(S.final)for(const m of S.marbles){if(!m.alive)continue;const n=m.trail.length;for(let i=0;i<n;i++){const p=m.trail[i],k=(i+1)/n;ctx.globalAlpha=k*0.3;ctx.fillStyle=m.color;ctx.beginPath();ctx.arc(p.x,p.y,m.r*(0.3+0.6*k),0,TAU);ctx.fill()}}
  for(const g of S.ghosts){ctx.globalAlpha=clamp(g.life/0.45,0,1)*0.6;ctx.fillStyle=g.color;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,TAU);ctx.fill()}
  ctx.globalAlpha=1;
  // 불길 (파이어스텝)
  for(const f of S.fires){const a=clamp(f.life/0.5,0,1);ctx.globalAlpha=a*0.85;ctx.fillStyle='#ff5722';ctx.beginPath();ctx.arc(f.x,f.y,f.r*0.55,0,TAU);ctx.fill();
    for(let k=0;k<3;k++){const fx=f.x+(k-1)*f.r*0.45,fh=f.r*(0.8+Math.random()*0.9);ctx.fillStyle=k===1?'#ffd166':'#ff7a3d';ctx.beginPath();ctx.moveTo(fx-f.r*0.3,f.y+f.r*0.2);ctx.lineTo(fx+(Math.random()-0.5)*4,f.y-fh);ctx.lineTo(fx+f.r*0.3,f.y+f.r*0.2);ctx.closePath();ctx.fill()}}
  ctx.globalAlpha=1;
  // 자석 물결 원 (당기는 동안만)
  for(const m of S.marbles){if(!m.alive||m.magnetT<=0)continue;const a=clamp(m.magnetT/0.3,0,1);ctx.globalAlpha=a*0.9;ctx.strokeStyle=SKILLS.magnet.color;ctx.lineWidth=2.5;ctx.beginPath();
    for(let i=0;i<=96;i++){const t=i/96*TAU,rr2=170-7-7*Math.sin(t*12-S.time*12);const px=m.x+Math.cos(t)*rr2,py=m.y+Math.sin(t)*rr2;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();
    ctx.globalAlpha=a*0.04;ctx.fillStyle=SKILLS.magnet.color;ctx.beginPath();ctx.arc(m.x,m.y,170,0,TAU);ctx.fill()}
  ctx.globalAlpha=1;
  // 회오리: 도는 나선 팔 3개
  for(const m of S.marbles){if(!m.alive||m.tornadoT<=0)continue;const a=clamp(m.tornadoT/0.3,0,1);ctx.lineWidth=3;
    for(let k=0;k<3;k++){ctx.globalAlpha=a*(k?0.55:0.8);ctx.strokeStyle=k?SKILLS.tornado.color:'#e6fffb';ctx.beginPath();
      for(let i=0;i<=28;i++){const u=i/28,rr2=30+u*185,ang=k*TAU/3+u*3.2+S.time*11;const px=m.x+Math.cos(ang)*rr2,py=m.y+Math.sin(ang)*rr2;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()}}
  ctx.globalAlpha=1;
  // 저격 조준선: 점선 + 조준 괄호 (시간이 갈수록 붉어지고 조여듦)
  for(const m of S.marbles){if(!m.alive||!m.aim||!m.aim.target.alive)continue;const t=m.aim.target,u=clamp(m.aim.t/m.aim.dur,0,1);
    ctx.globalAlpha=0.35+0.55*u;ctx.strokeStyle='#ff3b3b';ctx.lineWidth=1.5+u;ctx.setLineDash([8,6]);ctx.lineDashOffset=-S.time*60;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(t.x,t.y);ctx.stroke();ctx.setLineDash([]);
    const sz=t.r*(2.6-1.2*u),g=sz*0.45;ctx.lineWidth=2.5;ctx.beginPath();
    for(const [kx,ky] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ctx.moveTo(t.x+kx*sz,t.y+ky*(sz-g));ctx.lineTo(t.x+kx*sz,t.y+ky*sz);ctx.lineTo(t.x+kx*(sz-g),t.y+ky*sz)}
    ctx.moveTo(t.x-sz*0.5,t.y);ctx.lineTo(t.x+sz*0.5,t.y);ctx.moveTo(t.x,t.y-sz*0.5);ctx.lineTo(t.x,t.y+sz*0.5);ctx.stroke();
    if(u>0.8&&Math.floor(S.time*12)%2===0){ctx.fillStyle='rgba(255,59,59,0.25)';ctx.fillRect(t.x-sz,t.y-sz,sz*2,sz*2)}}
  ctx.globalAlpha=1;
  // 화염 브레스 부채꼴 (파편이 주 연출, 부채꼴은 범위 표시)
  for(const m of S.marbles){if(!m.alive||m.breathT<=0)continue;ctx.globalAlpha=0.16+0.1*Math.random();ctx.fillStyle='#ff6d00';ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.arc(m.x,m.y,190,m.breathA-0.55,m.breathA+0.55);ctx.closePath();ctx.fill();
    ctx.globalAlpha=0.2;ctx.fillStyle='#ffd166';ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.arc(m.x,m.y,110,m.breathA-0.4,m.breathA+0.4);ctx.closePath();ctx.fill()}
  ctx.globalAlpha=1;
  // 부메랑: 빙글 도는 V자
  for(const b of S.boomerangs){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.lineCap='round';ctx.strokeStyle='#d4a24c';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(24,0);ctx.moveTo(0,0);ctx.lineTo(Math.cos(1.85)*24,Math.sin(1.85)*24);ctx.stroke();
    ctx.strokeStyle='#fff3d0';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(20,0);ctx.moveTo(Math.cos(1.85)*4,Math.sin(1.85)*4);ctx.lineTo(Math.cos(1.85)*20,Math.sin(1.85)*20);ctx.stroke();ctx.lineCap='butt';ctx.restore()}
  // 벌떼
  for(const sw of S.swarms)for(const b of sw.bees){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));
    ctx.fillStyle='rgba(255,255,255,0.8)';const wf=Math.random()<0.5?1:0.4;ctx.beginPath();ctx.ellipse(-1,-4*wf,4,2.5,0,0,TAU);ctx.ellipse(-1,4*wf,4,2.5,0,0,TAU);ctx.fill();
    ctx.fillStyle='#ffca28';ctx.beginPath();ctx.ellipse(0,0,6,3.8,0,0,TAU);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-1,-3.5);ctx.lineTo(-1,3.5);ctx.moveTo(2,-3.2);ctx.lineTo(2,3.2);ctx.stroke();
    ctx.fillStyle='#222';ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(9,-1);ctx.lineTo(9,1);ctx.closePath();ctx.fill();ctx.restore()}
  // 폭탄: 폭발 범위(연한 붉은 원) + 큰 폭탄 모양
  for(const b of S.bombs){ctx.fillStyle='rgba(255,60,80,0.12)';ctx.beginPath();ctx.arc(b.x,b.y,150,0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,90,110,0.45)';ctx.lineWidth=2;ctx.setLineDash([10,8]);ctx.lineDashOffset=-S.time*40;ctx.stroke();
    ctx.strokeStyle='rgba(255,90,110,0.2)';ctx.lineWidth=1.5;ctx.setLineDash([4,10]);ctx.beginPath();ctx.arc(b.x,b.y,240,0,TAU);ctx.stroke();ctx.setLineDash([]); // 바깥 점선: 밀쳐내는 범위
    ctx.fillStyle='#1a1a22';ctx.beginPath();ctx.arc(b.x,b.y,16,0,TAU);ctx.fill();ctx.strokeStyle='#ffb347';ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.arc(b.x-5,b.y-5,5,0,TAU);ctx.fill();
    ctx.fillStyle='#8a8f9a';ctx.fillRect(b.x-4,b.y-21,8,6);ctx.strokeStyle='#c9a86a';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(b.x,b.y-21);ctx.quadraticCurveTo(b.x+8,b.y-30,b.x+4,b.y-36);ctx.stroke();
    ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(b.x+4,b.y-36,3+Math.random()*3,0,TAU);ctx.fill();
    if(Math.floor(b.t*(b.t<0.5?18:7))%2===0){ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.arc(b.x,b.y,5,0,TAU);ctx.fill()}
    ctx.fillStyle='#fff';ctx.font=`800 12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.t.toFixed(1),b.x,b.y+30)}
  for(const p of S.particles){ctx.globalAlpha=clamp(p.life/0.4,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill()}
  for(const r of S.rings){if(r.r*S.cam.zoom>1400)continue;const a=clamp(r.life/r.max,0,1);ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);if(r.fill){ctx.globalAlpha=a*0.4;ctx.fillStyle=r.color;ctx.fill()}else{ctx.globalAlpha=a;ctx.strokeStyle=r.color;ctx.lineWidth=r.w||5;ctx.stroke()}}
  ctx.globalAlpha=1;
  for(const b of S.bolts)drawBolt(b);
  // 화살 (크게: 길이 44, 깃털 포함)
  for(const a of S.arrows){const L=Math.hypot(a.vx,a.vy)||1,ux=a.vx/L,uy=a.vy/L;
    ctx.strokeStyle='#e0c080';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(a.x-ux*44,a.y-uy*44);ctx.lineTo(a.x,a.y);ctx.stroke();ctx.strokeStyle='#fff3d0';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#ff4d6d';for(const k of [-1,1]){ctx.beginPath();ctx.moveTo(a.x-ux*44,a.y-uy*44);ctx.lineTo(a.x-ux*34+k*(-uy)*8,a.y-uy*34+k*ux*8);ctx.lineTo(a.x-ux*26,a.y-uy*26);ctx.closePath();ctx.fill()}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(a.x+ux*14,a.y+uy*14);ctx.lineTo(a.x-uy*7,a.y+ux*7);ctx.lineTo(a.x+uy*7,a.y-ux*7);ctx.closePath();ctx.fill();ctx.strokeStyle='#e0c080';ctx.lineWidth=1;ctx.stroke()}
  // 얼음 창
  for(const a of S.spears){const L=Math.hypot(a.vx,a.vy)||1,ux=a.vx/L,uy=a.vy/L;
    ctx.fillStyle=SKILLS.frost.color;ctx.beginPath();ctx.moveTo(a.x+ux*22,a.y+uy*22);ctx.lineTo(a.x-uy*7,a.y+ux*7);ctx.lineTo(a.x-ux*26,a.y-uy*26);ctx.lineTo(a.x+uy*7,a.y-ux*7);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x-ux*20,a.y-uy*20);ctx.lineTo(a.x+ux*18,a.y+uy*18);ctx.stroke()}
  // 레이저
  for(const l of S.lasers){const a=clamp(l.life/l.max,0,1),k=l.life>l.max-0.08?1.4:1;ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);
    ctx.globalAlpha=a*0.3;ctx.strokeStyle=l.color;ctx.lineWidth=l.w*2.6*k;ctx.stroke();ctx.globalAlpha=a;ctx.lineWidth=l.w*k;ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=l.w*0.35*k;ctx.stroke()}
  ctx.globalAlpha=1;
  for(const m of S.marbles){if(m.alive)drawMarble(m)}
  // 검 궤적: 부채꼴(휘두름) / 직선(베기). 공 위에 그려서 가려지지 않게
  for(const o of S.slashes){const a=clamp(o.life/o.max,0,1);
    if(o.type==='arc'){const u=1-a;const a0=o.a-o.span/2,a1=o.a-o.span/2+o.span*Math.min(1,u*2.2);
      ctx.globalAlpha=a*0.85;ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(o.x,o.y,o.r,a0,a1);ctx.arc(o.x,o.y,o.r*0.5,a1,a0,true);ctx.closePath();ctx.fill();
      ctx.globalAlpha=a*0.6;ctx.strokeStyle=o.color;ctx.lineWidth=8;ctx.beginPath();ctx.arc(o.x,o.y,o.r+2,a0,a1);ctx.stroke();
      ctx.globalAlpha=a;ctx.strokeStyle='#fff';ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(o.x,o.y,o.r,a0,a1);ctx.stroke()}
    else{ctx.globalAlpha=a*0.4;ctx.strokeStyle=o.color;ctx.lineWidth=o.w*2.4;ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke();ctx.globalAlpha=a;ctx.lineWidth=o.w;ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=o.w*0.35;ctx.stroke()}}
  ctx.globalAlpha=1;
  for(const t of S.texts){ctx.globalAlpha=clamp(t.life/0.4,0,1);ctx.font=`800 ${t.size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillText(t.text,t.x+1.5,t.y+1.5);ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y)}
  ctx.globalAlpha=1;
  ctx.restore();

  // ---- HUD (화면 좌표) ----
  if(S.final){ // 결전: 가장자리를 어둡게 (결정타 순간은 더 어둡게). 그라데이션은 한 번 만들어 재사용
    const k=Math.min(1,S.finalT/1.5)*(S.finish?1.3:1);
    const key=`${W}x${H}:${L},${R},${T},${B}`;
    if(vigCache.key!==key){const c=document.createElement('canvas');c.width=Math.ceil((R-L+80)*DPR);c.height=Math.ceil((B-T+80)*DPR);const g2=c.getContext('2d');g2.scale(DPR,DPR);
      const g=g2.createRadialGradient((R-L)/2+40,(B-T)/2+40,Math.max(1,Math.min(R-L,B-T)*0.3),(R-L)/2+40,(B-T)/2+40,Math.max(2,Math.max(R-L,B-T)*0.7));g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');g2.fillStyle=g;g2.fillRect(0,0,R-L+80,B-T+80);vigCache.key=key;vigCache.c=c}
    ctx.globalAlpha=Math.min(0.85,0.6*k);ctx.drawImage(vigCache.c,L-40,T-40,R-L+80,B-T+80);ctx.globalAlpha=1;
  }
  if(S.letterbox>0.5){ // 연출 중 레터박스 + 배속 표시
    ctx.fillStyle='#000';ctx.fillRect(L-40,T-40,R-L+80,S.letterbox+40);ctx.fillRect(L-40,B-S.letterbox,R-L+80,S.letterbox+40);
    ctx.font=`800 12px ${FONT}`;ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,209,102,0.9)';ctx.fillText('0.7x',R-12,T+S.letterbox/2);
  }
  if(S.finish){ // 결정타 텍스트
    const p=clamp(S.finish.t/0.25,0,1),sc=1.6-0.6*p;let a=1;if(S.finish.t>S.finish.dur-0.4)a=Math.max(0,(S.finish.dur-S.finish.t)/0.4);
    ctx.save();ctx.translate(cx,cy-70);ctx.scale(sc,sc);ctx.globalAlpha=a;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.font=`900 54px ${FONT}`;ctx.lineWidth=10;ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.strokeText('결정타!',0,0);ctx.fillStyle='#ffd166';ctx.fillText('결정타!',0,0);
    ctx.font=`800 15px ${FONT}`;ctx.lineWidth=5;ctx.strokeText('FINAL BLOW',0,40);ctx.fillStyle='#fff';ctx.fillText('FINAL BLOW',0,40);ctx.restore();
  }
  if(barsOn()&&!S.duel){const lay=barLayout();for(const f of S.factions)if(f.barred)drawBar(f,lay.get(f))}
  if(S.duel&&S.duelists&&S.phase==='battle')drawDuelHud(L,R,T,B,cx);
  for(const s of S.shards){ctx.save();ctx.globalAlpha=clamp(s.life/0.5,0,1);ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.fillStyle=s.color;ctx.fillRect(-s.w/2,-s.h/2,s.w,s.h);ctx.restore()}
  for(const c of S.confetti){ctx.save();ctx.globalAlpha=clamp(c.life/1,0,1);ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.fillStyle=c.color;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore()}
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='top';
  const hudY=(S.duel&&S.phase==='battle')?12+DUEL_H+5:(barsOn()?T-16:T+8);
  if(S.phase==='battle'||S.phase==='finished'){
    ctx.font=`700 13px ${FONT}`;ctx.fillStyle='rgba(236,237,243,0.85)';
    const raceTxt=isRace()?`🏁 LAP ${Math.max(0,S.raceLap)+1}   ·   ${S.raceLap<1?'첫 바퀴는 탈락 없음':`이번 바퀴 꼴찌 ${raceK(aliveList().length)}명 탈락`}   ·   `:isHole()?`🌀 흡인력 ${Math.round(HOLE.pull+HOLE.grow*S.time)}   ·   `:'';
    ctx.fillText(`${raceTxt}⏱ ${fmt(S.time)}   ·   ${S.single?'':`남은 팀 ${factionsAlive()} / ${S.factions.length}   ·   `}생존 ${aliveList().length} / ${S.marbles.length}${opt.zone&&!isRace()&&S.time<CFG.zoneGrace?'   ·   🌀 자기장 '+Math.ceil(CFG.zoneGrace-S.time)+'초 후':''}${S.final?'   ·   ⚔️ FINAL':''}`,cx,hudY);
    if(S.determined&&S.phase==='battle'){ctx.font=`800 14px ${FONT}`;ctx.fillStyle='#ffd166';ctx.fillText('🏆 당첨 확정: '+S.winners.map(f=>f.name).join(', ')+'  ·  전투는 계속됩니다',cx,hudY+20)}
  }
  if(S.phase==='idle'){
    ctx.font=`600 13px ${FONT}`;ctx.fillStyle='rgba(139,141,156,0.9)';
    ctx.fillText(S.marbles.length<2?'이름을 2개 이상 입력하세요':'▶ 시작을 누르면 전투가 시작됩니다',cx,B-28);
  }
  if(S.phase==='countdown'){
    const n=Math.ceil(S.countdown),f=S.countdown-Math.floor(S.countdown);
    ctx.textBaseline='middle';ctx.font=`900 ${80+40*f}px ${FONT}`;ctx.fillStyle=`rgba(255,255,255,${0.35+0.65*f})`;
    ctx.fillText(n,cx,cy);
  }
  if(S.fight>0){
    const f=S.fight;ctx.textBaseline='middle';ctx.font=`900 ${70+(1-f)*40}px ${FONT}`;ctx.fillStyle=`rgba(255,209,102,${clamp(f*1.5,0,1)})`;
    ctx.fillText('FIGHT!',cx,cy);
  }
  drawToasts(R,T,B);
  drawBanner(cx,cy,B);
}

// ---------- 루프 ----------
let last=performance.now(),acc=0,rankTimer=0;const HS=1/120;
function frame(now){
  const real=Math.min(0.05,(now-last)/1000);last=now;
  if(W!==window.innerWidth||H!==window.innerHeight)resize(); // resize 이벤트를 놓친 경우(모바일 주소창/키보드 등) 대비
  const sim=S.phase==='countdown'||S.phase==='battle';
  // 결전 연출 중 0.7배속. 갑자기 바뀌면 끊기는 느낌이 나므로 0.2초에 걸쳐 부드럽게 전환
  const slowTarget=(S.focus||S.showdown||S.finish)?0.7:1;
  S.slowCur=S.slowCur===undefined?1:S.slowCur+(slowTarget-S.slowCur)*Math.min(1,real*8);
  const slow=S.slowCur;
  if(sim){acc+=real*opt.speed*slow;let g=0;while(acc>=HS&&g++<48){step(HS);acc-=HS}}else acc=0;
  if(S.finish){S.finish.t+=real;if(S.finish.t>=S.finish.dur)S.finish=null}
  // 전투가 끝나 시뮬레이션이 멈춘 뒤에도 피격 번쩍임·돌진 잔광·보호막·화상 같은 순간 효과는 계속 사그라들게 (마지막 장면이 하얗게 굳지 않도록)
  if(S.phase==='finished')for(const m of S.marbles){if(!m.alive)continue;m.hit=Math.max(0,m.hit-real*4);m.dash=Math.max(0,m.dash-real);m.shieldFx=Math.max(0,m.shieldFx-real);m.burn=Math.max(0,m.burn-real*3);m.frozen=Math.max(0,m.frozen-real);m.swing=Math.max(0,m.swing-real);m.hammerT=Math.max(0,m.hammerT-real);m.magnetT=Math.max(0,m.magnetT-real);m.tornadoT=Math.max(0,m.tornadoT-real);m.aim=null;m.breathT=0;m.rocketT=0;m.rocketCharge=0}
  if(S.phase==='finished'){S.boomerangs.length=0;S.swarms.length=0}
  fx(real*slow);
  S.fight=Math.max(0,S.fight-real);
  // 물리 스텝 사이를 보간해서 그린다 (0.7배속처럼 한 프레임에 스텝 수가 들쭉날쭉해도 움직임이 매끄럽게)
  const alpha=sim?clamp(acc/HS,0,1):1;
  if(sim)for(const m of S.marbles){if(!m.alive||m.px===undefined)continue;m.sx=m.x;m.sy=m.y;m.x=m.px+(m.x-m.px)*alpha;m.y=m.py+(m.y-m.py)*alpha}
  updateCamera(real);
  render();
  if(sim)for(const m of S.marbles){if(m.sx!==undefined){m.x=m.sx;m.y=m.sy;m.sx=undefined}}
  rankTimer-=real;if(rankTimer<=0&&S.phase!=='idle'){rankTimer=0.3;updateRank()}
  requestAnimationFrame(frame);
}

// ---------- UI ----------
function seg(el,cb){el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(b.dataset.v)}))}
seg($('#modeSeg'),v=>{opt.mode=v;multiRow.hidden=v!=='multi'});
seg($('#gameSeg'),v=>{opt.game=v;const r=v==='race'||v==='hole';$('#zoneRow').hidden=r;opt.finalAt=r?10:FINAL_AT;finalN.value=opt.finalAt;setup()}); // 레이스·블랙홀은 기본 결전 인원 10
seg($('#speedSeg'),v=>{opt.speed=+v});
seg($('#zoneSeg'),v=>{opt.zone=v==='1'});
seg($('#teamSeg'),v=>{opt.teamFire=v==='1'});
seg($('#faceSeg'),v=>{opt.faces=v==='1';deadKey=-1;updateRank()});
document.querySelectorAll('#mtabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#mtabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.body.dataset.tab=b.dataset.t}));
finalN.addEventListener('input',()=>{const v=parseInt(finalN.value,10);if(!isNaN(v))opt.finalAt=clamp(v,2,10)});
finalN.addEventListener('change',()=>{opt.finalAt=clamp(parseInt(finalN.value,10)||FINAL_AT,2,10);finalN.value=opt.finalAt});
btnStart.addEventListener('click',start);
btnShuffle.addEventListener('click',()=>{seed=(Math.random()*1e9)>>>0;S.seedUsed=false;setup()});
// 입력을 고치기 시작하면 진행 중이던 전투는 즉시 리셋
let deb=0;namesEl.addEventListener('input',()=>{if(S.phase!=='idle')setup();clearTimeout(deb);deb=setTimeout(()=>setup(),200)});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.isTrusted&&!e.repeat&&document.activeElement!==namesEl){e.preventDefault();if(S.phase==='idle'||S.phase==='finished')start()}});

window.RW={S,CFG,BAL,opt,SKILLS,OBST,RACE,HOLE,trackPos,step,setup,start,aliveList,ranking,factionRanking,render,updateCamera,fx,setSeed:v=>{seed=v>>>0}};
setup();
requestAnimationFrame(frame);
})();
</script>
</body>
